name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: ['package']
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: out

      - name: Read version from mod.json
        id: ver
        run: echo "version=$(jq -r .version mod.json)" >> "$GITHUB_OUTPUT"

      - name: Create or update the GitHub release for this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Flameperfect ${{ steps.ver.outputs.version }}
          files: out/*.geode
          fail_on_unmatched_files: true

      - name: Save the build on the "builds" branch
        run: |
          mkdir -p /tmp/b && cp out/*.geode /tmp/b/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rfq .
          cp /tmp/b/*.geode .
          git add *.geode
          git commit -qm "Build ${{ steps.ver.outputs.version }} (${{ github.sha }})"
          git push -f origin builds
