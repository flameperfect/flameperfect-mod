name: Remove old v1.0.1 release

on:
  push:
    branches:
      - main

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the old v1.0.1 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.0.1 -R "${{ github.repository }}" --cleanup-tag -y || true
